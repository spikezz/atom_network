[project]
name = "atom-network"
version = "0.1.0"
description = "A microscope for the smallest neural network — watch a 2-2-1 MLP learn, in real time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

# This tiny 9-parameter network needs no GPU — pull the much smaller CPU wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atom"]
