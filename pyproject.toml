[project]
name = "atom-network"
version = "0.1.0"
description = "A microscope for the smallest neural network — watch a 2-2-1 MLP learn, in real time."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pyyaml>=6.0.3",
]

# CUDA build so the grid can train on the GPU (prefers the RTX 3070). A single
# tiny net runs fine on CPU; GPU pays off when the capacity grid grows.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atom"]
