# atom_network — capacity grid configuration
#
# Edit this file and run `uv run python grid.py` (no flags needed).
# Any value can still be overridden on the command line, e.g.
#   uv run python grid.py --rows 3 --cols 4
# A CLI flag always wins over what is written here.

grid:
  rows: 2          # ↓ depth axis  — number of rows    (each row adds one hidden layer)
  cols: 2          # → width axis  — number of columns (each col adds one neuron per hidden layer)
  base_width: 2    # neurons per hidden layer in the top-left cell
  base_depth: 1    # number of hidden layers in the top-left cell

training:
  task: regression       # regression | classification
  epochs: 2000
  lr: 0.01
  snapshot_every: 40     # capture one animation frame every N epochs
  seed: 42

render:
  fps: 12
  out: outputs           # output directory

device: null             # null = auto (prefers RTX 3070); or "cpu" / "cuda:0"
